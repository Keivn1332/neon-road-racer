<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>迷你賽車｜霓虹公路</title>
<style>
:root{color-scheme:dark;--ink:#f5f5f7;--muted:#a8b0c4;--cyan:#67f5df;--pink:#ff5a7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#25254a 0,#111321 48%,#0a0b12 100%);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}.shell{width:min(100%,980px)}header{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 2px 14px}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--cyan);font-weight:800}h1{font-size:clamp(26px,5vw,42px);line-height:1;margin:7px 0 0;letter-spacing:.04em}.hint{color:var(--muted);font-size:13px;text-align:right}.board{position:relative;border:1px solid #ffffff24;border-radius:22px;overflow:hidden;background:#111827;box-shadow:0 24px 80px #0009,0 0 50px #57e7df12}canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}.hud{position:absolute;inset:14px 16px auto;display:flex;justify-content:space-between;pointer-events:none}.pill{min-width:108px;padding:9px 13px;border-radius:12px;background:#0a0e19bb;border:1px solid #ffffff20;backdrop-filter:blur(8px)}.label{display:block;color:#a9b3c9;font-size:10px;letter-spacing:.15em}.value{font-size:20px;font-weight:850;font-variant-numeric:tabular-nums}.value small{font-size:11px;color:var(--muted);font-weight:600}.center{position:absolute;inset:0;display:grid;place-items:center;background:#090b15a6;backdrop-filter:blur(5px);transition:opacity .2s}.center.hidden{opacity:0;pointer-events:none}.card{text-align:center;padding:28px 32px;border-radius:20px;background:#141a2ae8;border:1px solid #ffffff25;box-shadow:0 20px 60px #0008;max-width:390px}.card h2{font-size:29px;margin:0 0 8px}.card p{color:#b9c2d3;line-height:1.65;margin:0 0 18px}.accent{color:var(--cyan)}button{border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(120deg,#66f5dc,#75c9ff);color:#071218;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 7px 24px #4cebd744}button:hover{filter:brightness(1.08);transform:translateY(-1px)}.bottom{display:flex;justify-content:space-between;align-items:center;color:#929bb0;font-size:12px;padding:12px 4px 0}.mobile{display:none;gap:12px;justify-content:center;margin-top:12px}.mobile button{width:78px;height:58px;font-size:22px;background:#20263a;color:white;border:1px solid #ffffff25;box-shadow:none;touch-action:none}@media(max-width:640px){body{padding:10px}.hint{font-size:11px}.hud{inset:8px 8px auto}.pill{min-width:78px;padding:6px 8px}.value{font-size:16px}.label{font-size:8px}.mobile{display:flex}.bottom{font-size:10px}.card{margin:12px;padding:22px 20px}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">ARCADE • 01</div><h1>霓虹公路</h1></div><div class="hint">閃過車流，收集星星<br>← → 或 A / D 操控</div></header><section class="board"><canvas id="game" width="960" height="600" aria-label="霓虹公路賽車遊戲"></canvas><div class="hud"><div class="pill"><span class="label">分數 SCORE</span><span class="value" id="score">0000</span></div><div class="pill" style="text-align:right"><span class="label">速度 SPEED</span><span class="value" id="speed">0 <small>KM/H</small></span></div></div><div class="center" id="overlay"><div class="card"><h2 id="title">準備上路？</h2><p id="message">躲開車流、撿起星星，看看你能跑多遠。<br>使用 <span class="accent">← →</span> 或 <span class="accent">A / D</span> 移動。</p><button id="start">開始比賽</button></div></div></section><div class="mobile"><button id="left" aria-label="向左">◀</button><button id="right" aria-label="向右">▶</button></div><footer class="bottom"><span>撞到車輛就結束，收集星星加分</span><span>個人最佳 <b id="best">0000</b></span></footer></main>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=c.width,H=c.height,overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),speedEl=document.querySelector('#speed'),bestEl=document.querySelector('#best');let best=+(localStorage.neonBest||0),running=false,score=0,frame=0,speed=5,roadOffset=0,player={lane:1,x:480,y:480},cars=[],stars=[],keys={};bestEl.textContent=String(best).padStart(4,'0');const lanes=[365,480,595];
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCar(x,y,color,playerCar=false){ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=playerCar?18:8;rounded(-23,-39,46,78,13,color);ctx.shadowBlur=0;rounded(-17,-27,34,23,8,playerCar?'#b9fff5':'#d6efff');rounded(-16,7,32,18,6,playerCar?'#159c98':'#20283d');rounded(-27,-24,6,16,3,'#10121a');rounded(21,-24,6,16,3,'#10121a');rounded(-27,15,6,16,3,'#10121a');rounded(21,15,6,16,3,'#10121a');rounded(-17,-37,10,5,2,'#fff5cf');rounded(7,-37,10,5,2,'#fff5cf');ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#13182e');sky.addColorStop(1,'#21364a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);for(let i=0;i<36;i++){let x=(i*173+39)%W,y=(i*97+frame*.15)%260;ctx.fillStyle=`rgba(190,220,255,${.15+(i%4)*.1})`;ctx.fillRect(x,y,2,2)}ctx.fillStyle='#183d3b';ctx.fillRect(225,0,510,H);ctx.fillStyle='#182333';ctx.fillRect(270,0,420,H);ctx.fillStyle='#ed6581';ctx.fillRect(266,0,5,H);ctx.fillRect(689,0,5,H);ctx.fillStyle='#eef5dc';for(let y=-40+(roadOffset%100);y<H;y+=100){ctx.fillRect(267,y,4,48);ctx.fillRect(689,y,4,48)}ctx.fillStyle='#6be8d1';for(let x=375;x<690;x+=105)for(let y=-50+(roadOffset%100);y<H;y+=100)ctx.fillRect(x,y,3,48);for(const s of stars){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(frame*.035);ctx.shadowColor='#ffe879';ctx.shadowBlur=16;ctx.fillStyle='#ffe879';ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?8:16;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}cars.forEach(a=>drawCar(a.x,a.y,a.color));drawCar(player.x,player.y,'#5df3dd',true);if(!running&&frame===0){ctx.globalAlpha=.1;for(let i=0;i<4;i++)drawCar(lanes[i%3],220+i*90,['#ff607b','#ffc45d','#9b7cff'][i%3]);ctx.globalAlpha=1}}
function start(){score=0;frame=0;speed=5;cars=[];stars=[];player.lane=1;player.x=lanes[1];running=true;overlay.classList.add('hidden');loop()}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.neonBest=best;bestEl.textContent=String(best).padStart(4,'0');document.querySelector('#title').textContent='漂亮的一趟！';document.querySelector('#message').innerHTML=`本次得分 <span class="accent">${String(Math.floor(score)).padStart(4,'0')}</span><br>再跑一趟，刷新你的最佳紀錄。`;document.querySelector('#start').textContent='再玩一次';overlay.classList.remove('hidden')}
function move(d){if(!running)return;player.lane=Math.max(0,Math.min(2,player.lane+d))}
function loop(){if(!running)return;frame++;speed=Math.min(12,5+score/900);roadOffset+=speed*2;score+=.12*speed;player.x+=(lanes[player.lane]-player.x)*.24;if(frame%Math.max(28,72-Math.floor(speed*3))===0){let lane=Math.floor(Math.random()*3);cars.push({x:lanes[lane],y:-60,color:['#ff607b','#ffc45d','#9b7cff','#68a3ff'][Math.floor(Math.random()*4)]})}if(frame%105===0)stars.push({x:lanes[Math.floor(Math.random()*3)],y:-30});cars.forEach(a=>a.y+=speed*1.1);stars.forEach(a=>a.y+=speed);cars=cars.filter(a=>a.y<H+80);stars=stars.filter(a=>a.y<H+30);for(const a of cars)if(Math.abs(a.x-player.x)<39&&Math.abs(a.y-player.y)<62){draw();end();return}stars=stars.filter(a=>{if(Math.abs(a.x-player.x)<34&&Math.abs(a.y-player.y)<42){score+=100;return false}return true});scoreEl.textContent=String(Math.floor(score)).padStart(4,'0');speedEl.innerHTML=`${Math.round(speed*18)} <small>KM/H</small>`;draw();requestAnimationFrame(loop)}
document.querySelector('#start').onclick=start;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if((e.key==='ArrowLeft'||e.key.toLowerCase()==='a')&&!keys.left){move(-1);keys.left=true}if((e.key==='ArrowRight'||e.key.toLowerCase()==='d')&&!keys.right){move(1);keys.right=true}if(e.key===' '&&!running)start()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});function bind(id,d){let b=document.querySelector(id);b.addEventListener('pointerdown',e=>{e.preventDefault();move(d)})}bind('#left',-1);bind('#right',1);let touchX=null;c.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});c.addEventListener('touchend',e=>{if(touchX!==null){let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>25)move(dx>0?1:-1);touchX=null}},{passive:true});draw()})();
</script></body></html>
